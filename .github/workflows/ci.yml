name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Serviço, PostgreSQL e contrato SICOF
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      SICOF_REPO_DIR: ${{ github.workspace }}/sicof-client
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Baixar serviço de licença
        uses: actions/checkout@v4
      - name: Baixar cliente SICOF usado no teste de contrato
        uses: actions/checkout@v4
        with:
          repository: sidneiauditor/sicof
          path: sicof-client
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Executar suíte completa
        run: python -m pytest -q
